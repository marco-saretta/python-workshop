title: "Python workshop - Good practices"
description: "A short description"
remote_theme: just-the-docs/just-the-docs
url: "https://marco-saretta.github.io/python-workshop/"

# Optional but recommended
color_scheme: light
search_enabled: true

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

callouts:
  note:
    title: Note
    color: purple
  warning:
    title: Warning
    color: red
  important:
    title: Important
    color: blue
  highlight:
    color: yellow